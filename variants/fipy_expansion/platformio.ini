[FiPy_Expansion]
extends = esp32_base
board = esp32dev
board_build.mcu = esp32
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.partitions = min_spiffs.csv
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
build_flags = ${esp32_base.build_flags}
  ${sensor_base.build_flags}
  -I variants/fipy_expansion
  -UENV_INCLUDE_GPS
  -D FIPY_EXPANSION
  -D RADIO_CLASS=CustomSX1272
  -D WRAPPER_CLASS=CustomSX1272Wrapper
  -D USE_SX1272
  -D P_LORA_SCLK=5
  -D P_LORA_MOSI=27
  -D P_LORA_MISO=19
  -D P_LORA_NSS=18
  -D P_LORA_DIO_0=23
  -D P_LORA_DIO_1=23
  -D P_LORA_RESET=-1
  -D SX127X_CURRENT_LIMIT=120
  -D LORA_TX_POWER=14
  -D PIN_VBAT_READ=36
  -D PIN_BATT_EN=15
  -D P_LORA_TX_LED=16
  -D PIN_BOARD_SDA=13
  -D PIN_BOARD_SCL=22
  -D PIN_USER_BTN=33
  -D PIN_SERIAL_RX=2
  -D PIN_SERIAL_TX=1
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/fipy_expansion>
  +<helpers/sensors>
lib_deps =
  ${esp32_base.lib_deps}
  ${sensor_base.lib_deps}

; Bare BLE companion: MeshCore app over Bluetooth, no OLED.
[env:FiPy_companion_radio_ble_bare]
extends = FiPy_Expansion
build_src_filter = ${FiPy_Expansion.build_src_filter}
  +<../examples/companion_radio/*.cpp>
  +<helpers/esp32/*.cpp>
build_flags =
  ${FiPy_Expansion.build_flags}
  -D MAX_CONTACTS=160
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=128
lib_deps =
  ${FiPy_Expansion.lib_deps}
  densaugeo/base64 @ ~1.4.0

; Full BLE companion: optional SSD1306 on P9/P10 plus I2C sensors.
[env:FiPy_companion_radio_ble]
extends = FiPy_Expansion
build_flags =
  ${FiPy_Expansion.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=160
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D DISPLAY_CLASS=SSD1306Display
  -D OFFLINE_QUEUE_SIZE=128
build_src_filter = ${FiPy_Expansion.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/esp32/*.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${FiPy_Expansion.lib_deps}
  densaugeo/base64 @ ~1.4.0
  adafruit/Adafruit SSD1306 @ ^2.5.13

; USB companion: MeshCore app over the Expansion Board 3 PIC serial port.
; No BLE, no OLED. Do not enable MESH_PACKET_LOGGING or MESH_DEBUG; they share Serial.
[env:FiPy_companion_radio_usb]
extends = FiPy_Expansion
build_src_filter = ${FiPy_Expansion.build_src_filter}
  +<../examples/companion_radio/*.cpp>
  +<helpers/esp32/*.cpp>
build_flags =
  ${FiPy_Expansion.build_flags}
  -D MAX_CONTACTS=160
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=128
  -D ENABLE_USB_INTERFACE
lib_deps =
  ${FiPy_Expansion.lib_deps}
  densaugeo/base64 @ ~1.4.0
